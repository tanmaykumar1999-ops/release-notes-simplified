name: Daily release notes refresh

on:
  schedule:
    - cron: '30 3 * * *'   # 3:30 AM UTC = 9:00 AM IST — runs once every 24 hours
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Call refresh endpoint
        env:
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          REFRESH_URL: https://release-notes-simplifier-production.up.railway.app
        run: node .github/scripts/trigger-refresh.js